<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>Offline · Wetter & Kalender</title>
  <style>
    :root{color-scheme:dark;--text:#edf5ff;--muted:#8ea3bd;--cyan:#69dded;--line:rgba(164,190,220,.14)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 12% 0%,rgba(41,126,172,.2),transparent 36rem),linear-gradient(160deg,#07101d,#0b1728 60%,#0a1422);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    main{width:min(560px,100%);padding:clamp(23px,5vw,38px);border:1px solid var(--line);border-radius:24px;background:rgba(17,31,50,.82);box-shadow:0 24px 70px rgba(0,0,0,.25);text-align:center}
    .symbol{width:64px;height:64px;margin:0 auto 19px;display:grid;place-items:center;border:1px solid rgba(105,221,237,.25);border-radius:20px;background:rgba(105,221,237,.1);color:var(--cyan);font-size:30px}
    .eyebrow{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:10px 0;font-size:clamp(27px,6vw,36px);letter-spacing:-.04em}
    p{color:var(--muted);font-size:13px;line-height:1.65}
    nav{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:23px}
    a{padding:11px 15px;border:1px solid rgba(105,221,237,.25);border-radius:12px;color:#eafaff;background:rgba(55,160,184,.14);font-size:12px;text-decoration:none}
    a:hover{border-color:rgba(105,221,237,.55)}
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">☁</div>
    <div class="eyebrow">Keine Internetverbindung</div>
    <h1>Du bist gerade offline.</h1>
    <p>Die App-Seiten wurden lokal gespeichert. Der Kalender funktioniert weiterhin. Aktuelle Wetterdaten, amtliche Warnmeldungen und das externe Regenradar benötigen jedoch eine Internetverbindung.</p>
    <nav aria-label="Offline verfügbare Seiten">
      <a href="./Wetter.html">Wetterseite öffnen</a>
      <a href="./Kalender.html">Kalender öffnen</a>
    </nav>
  </main>
</body>
</html>
