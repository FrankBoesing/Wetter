<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wetter">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta http-equiv="refresh" content="0; url=Wetter.html">
  <title>Wetter</title>
  <link rel="canonical" href="Wetter.html">
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .catch(error => console.error('Service Worker konnte nicht registriert werden:', error));
    }
  </script>
  <script>
    window.location.replace(new URL("Wetter.html", window.location.href).href);
  </script>
</head>
<body>
  <p>Weiterleitung zur <a href="Wetter.html">Wetterseite</a> …</p>
</body>
</html>
